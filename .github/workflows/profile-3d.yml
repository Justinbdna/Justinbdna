name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Traduction FR et personnalisation des indicateurs
        run: |
          python3 -c '
          import glob, re

          star_pat = re.compile(
              r"""<g transform="translate\(608, 802\), scale\(2\)"><path fill-rule="evenodd" d="M8 \.25a\.75\.75.*?fill="([^"]+)"></path></g>\s*<text style="([^"]*)" x="650" y="830" [^>]*>\d+<title>\d+</title></text>""",
              re.DOTALL
          )

          def rep_star(m):
              color = m.group(1)
              return (
                  f"<g transform=\"translate(555, 802), scale(2)\">"
                  f"<path fill-rule=\"evenodd\" d=\"M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z\" fill=\"{color}\"></path>"
                  f"</g>"
                  f"<text style=\"font-size: 32px; font-weight: bold;\" x=\"595\" y=\"830\" text-anchor=\"start\" fill=\"{color}\">12 <tspan style=\"font-size: 24px; font-weight: normal;\">dépôts</tspan><title>12 dépôts</title></text>"
              )

          translations = [
              (r"(?<=[>])Commit(?=<title>)", "Commits"),
              (r"(?<=[>])Issue(?=<title>)", "Tickets"),
              (r"(?<=[>])PullReq(?=<title>)", "Pull Requests"),
              (r"(?<=[>])Review(?=<title>)", "Revues"),
              (r"(?<=[>])Repo(?=<title>)", "Dépôts"),
              (r"(?<=[>])other(?=[< ])", "Autres"),
          ]

          for fpath in glob.glob("profile-3d-contrib/*.svg"):
              with open(fpath, "r", encoding="utf-8") as f:
                  content = f.read()
              content = star_pat.sub(rep_star, content)
              content = re.sub(r"transform=\"translate\(736, 802\), scale\(2\)\"", "transform=\"translate(755, 802), scale(2)\"", content)
              content = re.sub(r"(<text [^>]*\bx=)\"772\"([^>]*>\d+<title>\d+</title></text>)", r"\g<1>\"791\"\2", content)
              for pat, rep in translations:
                  content = re.sub(pat, rep, content)
              with open(fpath, "w", encoding="utf-8") as f:
                  f.write(content)
          '
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: actualisation de la skyline 3D en français" || exit 0
          git push
